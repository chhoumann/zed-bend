name = "Bend"
grammar = "bend"
path_suffixes = ["bend"]
line_comments = ["# "]
tab_size = 2
autoclose_before = ",:;)]}>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
increase_indent_pattern = ":\\s*$"
decrease_indent_pattern = "^\\s*case\\b"
